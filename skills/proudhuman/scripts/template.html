<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title_text}}</title>
<style>
/* Tokens are defined once with light-dark(); which side applies follows the
   root's color-scheme. Auto follows the system; the theme selector in the
   masthead forces light or dark with CSS alone (no script). */
:root {
  --paper: light-dark(#F5F4F0, #161A1F);
  --ink: light-dark(#1E262E, #E6E4DF);
  --ink-2: light-dark(#5C6570, #A3A9B1);
  --rule: light-dark(#D9D8D2, #2C333B);
  --accent: light-dark({{accent_light}}, {{accent_dark}});
  --graphite: light-dark(#8A8F98, #5A6068);
  --graphite-soft: light-dark(#C9CCD1, #3A4048);
  --paper-2: light-dark(#ECEBE6, #1E242B);
  --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --sans: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  color-scheme: light dark;
}
:root:has(#theme-light:checked) { color-scheme: light; }
:root:has(#theme-dark:checked) { color-scheme: dark; }

/* theme selector */
.theme { position: absolute; top: 0; right: 0; display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; font-size: 0.78rem; line-height: 1; color: var(--ink-2); }
.theme input { position: absolute; opacity: 0; width: 0; height: 0; }
.theme label { padding: 0.35rem 0.7rem; border-radius: 999px; cursor: pointer; }
.theme input:checked + label { background: var(--paper-2); color: var(--ink); }
.theme input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 1px; }
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
code, .mono, pre { font-family: var(--mono); font-size: 0.86em; }
pre { white-space: pre-wrap; word-break: break-word; margin: 0.6rem 0 0; padding: 0.8rem 1rem; background: var(--paper-2); border-left: 2px solid var(--rule); max-height: 28rem; overflow: auto; line-height: 1.5; }

/* One measure for everything: the page is the text width, and charts, lists and
   figures fill it, so nothing steps out to the right of the prose. */
.page { max-width: 46rem; margin: 0 auto; padding: 3rem 1.25rem 5rem; }

/* masthead */
.masthead { position: relative; padding: 0 0 2.5rem; border-bottom: 1px solid var(--rule); margin-bottom: 3rem; }
.kicker { padding-right: 12rem; }
.kicker { font-family: var(--serif); font-style: italic; color: var(--ink-2); margin: 0 0 1.4rem; font-size: 1.05rem; }
.ident { color: var(--ink-2); font-size: 0.95rem; margin: 0 0 0.35rem; }
.ident .subject { color: var(--ink); }
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(2.1rem, 5vw, 3.2rem); line-height: 1.1; letter-spacing: -0.01em; margin: 0.2rem 0 1.2rem; max-width: 22ch; }
.byline { color: var(--ink-2); font-size: 0.95rem; margin: 0; }
.byline span + span { margin-left: 0.9rem; padding-left: 0.9rem; border-left: 1px solid var(--rule); }

/* chapters */
.chapter { padding: 0 0 3.5rem; margin: 0 0 3.5rem; border-bottom: 1px solid var(--rule); }
.chapter:last-of-type { border-bottom: 0; }
.chapter-head { display: grid; grid-template-columns: 240px 1fr; gap: 2rem; align-items: end; margin-bottom: 1.6rem; }
.scene { color: var(--accent); position: relative; }
.scene svg { width: 100%; height: auto; display: block; }
.scene .badge { position: absolute; top: -4px; right: -4px; min-width: 2rem; height: 2rem; padding: 0 0.4rem; border-radius: 1rem; border: 1.5px solid var(--accent); background: var(--paper); color: var(--accent); font-family: var(--serif); font-size: 0.95rem; line-height: calc(2rem - 3px); text-align: center; box-sizing: border-box; }
.scene.muted .badge { border-color: var(--graphite); color: var(--graphite); }
.scene.muted { color: var(--graphite); opacity: 0.55; }
.scene-missing { aspect-ratio: 320 / 200; border: 1px dashed var(--rule); }
.chapter-word { font-family: var(--serif); font-style: italic; color: var(--ink-2); margin: 0; font-size: 1rem; }
h2 { font-family: var(--serif); font-weight: 400; font-size: 2rem; line-height: 1.15; margin: 0.1rem 0 0.6rem; }
h3 { font-family: var(--serif); font-weight: 400; font-size: 1.25rem; margin: 2rem 0 0.6rem; }
.lede { font-family: var(--serif); font-size: 1.2rem; line-height: 1.45; margin: 0; }
.prose { max-width: none; }
.prose p { margin: 0 0 1rem; }
.prose.thin p { color: var(--ink-2); font-family: var(--serif); font-style: italic; }
.hint { color: var(--ink-2); font-size: 0.9rem; }

/* beats on a rule */
.beats { list-style: none; margin: 1.5rem 0 0; padding: 0 0 0 1.4rem; border-left: 2px solid var(--rule); position: relative; }
ol.beats > li { position: relative; margin: 0 0 1.8rem; }
ol.beats > li::before { content: ""; position: absolute; left: calc(-1.4rem - 6px); top: 0.55rem; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
ol.judgments > li::before { border-radius: 0; transform: rotate(45deg); top: 0.5rem; }
div.beats { padding-left: 1.4rem; }
.beat-label { color: var(--ink-2); font-size: 0.9rem; margin: 0 0 0.3rem; }
.meta { color: var(--ink-2); font-size: 0.88rem; margin: 0 0 0.3rem; }
.meta time { font-variant-numeric: tabular-nums; }
.dwell { font-style: italic; }
.excerpt { font-family: var(--serif); font-size: 1.15rem; line-height: 1.45; margin: 0; quotes: "\201C" "\201D"; }
.excerpt::before { content: open-quote; color: var(--accent); }
.excerpt::after { content: close-quote; color: var(--accent); }
.caption { margin: 0.5rem 0 0; }
.consequence { margin: 0.3rem 0 0; font-size: 0.86rem; color: var(--ink-2); }
.consequence .path { font-family: var(--mono); background: var(--paper-2); padding: 0.05rem 0.35rem; border-radius: 3px; margin-right: 0.3rem; white-space: nowrap; }
.consequence .path.outside { opacity: 0.6; }
.passthrough { margin: 0.5rem 0 0; font-size: 0.92rem; color: var(--ink-2); }
details { margin: 0.4rem 0 0; }
summary { cursor: pointer; color: var(--accent); font-size: 0.9rem; }
details.more { margin: 0 0 0.6rem; }
li.beyond { display: none; }
details.more[open] ~ ol.beats li.beyond { display: list-item; }
.anchor { position: absolute; margin-top: -2rem; }

/* judgments */
.ev { margin: 0.4rem 0 0; }
.ev-label { color: var(--ink-2); font-size: 0.9rem; }
.ev-text { color: var(--graphite); }
.ev-text.mono { font-family: var(--mono); }
.next { margin: 0.4rem 0 0; }
.next q { font-family: var(--serif); font-size: 1.05rem; }
.scene-text { margin: 0.8rem 0 0; }

/* verifications, commits, attempts */
.verifications ul, .commits ol, .attempts ol { list-style: none; margin: 0; padding: 0; }
.verifications li, .commits li, .attempts li { position: relative; margin: 0 0 0.5rem; font-size: 0.95rem; }
.attempts li { margin: 0 0 1rem; }
.attempts li code { display: block; margin: 0.2rem 0; padding: 0.4rem 0.7rem; background: var(--paper-2); border-left: 2px solid var(--rule); word-break: break-all; }
.attempts li.closest code { border-left-color: var(--accent); }
.attempts .ev-text { display: block; font-size: 0.9rem; margin: 0.2rem 0; }
.verifications time, .commits time, .attempts time { color: var(--ink-2); font-variant-numeric: tabular-nums; margin-right: 0.4rem; }
.who { color: var(--ink-2); font-size: 0.85rem; white-space: nowrap; }
.commits li { padding-left: 3.4rem; text-indent: -3.4rem; }
.commits li .sha { margin-right: 0.3rem; }
.who-human { color: var(--accent); }
.who-claude { color: var(--graphite); }
.commits .subject { font-family: var(--serif); }
.outcome { font-size: 0.85rem; }
.outcome-error { color: var(--ink-2); font-style: italic; }
.delta { color: var(--ink-2); font-size: 0.85rem; }
.iterations { color: var(--ink-2); font-size: 0.95rem; margin: 1.5rem 0 0; }
.ship-line { font-size: 1.05rem; }
.strong { font-weight: 600; }
.presence { font-family: var(--serif); font-size: 1.15rem; margin: 1.2rem 0 0; }

/* charts */
.chart-fig { margin: 2rem 0; width: 100%; }
.chart-fig figcaption { color: var(--ink-2); font-size: 0.92rem; margin: 0 0 0.6rem; }
.fig-title { font-family: var(--serif); font-style: italic; color: var(--ink); font-size: 1.05rem; margin-right: 0.4rem; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--sans); font-size: 12px; fill: var(--ink-2); }
.chart .band-label { fill: var(--ink); font-family: var(--mono); font-size: 12px; }
.chart .band-sub { font-size: 11px; }
.chart .axis { font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .lgd { font-size: 12px; fill: var(--ink-2); }
.chart .row-label { font-size: 12px; fill: var(--ink); }
.chart .row-label.strong { font-weight: 600; }
.chart .row-count { font-size: 11px; }
.chart .activity { fill: var(--graphite-soft); stroke: none; }
.chart .activity-hatch { stroke: none; }
.chart .hatch-line { stroke: var(--graphite); stroke-width: 0.8; opacity: 0.55; }
.chart .baseline { stroke: var(--graphite); stroke-width: 1; }
.chart .thread { stroke: var(--accent); stroke-width: 1; opacity: 0.45; }
.chart .m-spark, .chart .m-steer, .chart .m-verification { fill: var(--accent); stroke: var(--paper); stroke-width: 1.5; }
.chart .m-question { fill: var(--paper); stroke: var(--accent); stroke-width: 2; }
.chart .m-question-dot { fill: var(--accent); }
.chart .m-judgment { fill: var(--accent); stroke: var(--paper); stroke-width: 1.5; }
.chart .m-commit { stroke: var(--ink); stroke-width: 1.5; }
.chart .m-ship { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
.chart a:hover .m-steer, .chart a:hover .m-judgment, .chart a:hover .m-spark, .chart a:hover .m-verification { stroke: var(--ink); }
.chart .seg-emitted { fill: var(--graphite); }
.chart .seg-moved { fill: var(--graphite-soft); }
.chart .seg-said { fill: var(--graphite); opacity: 0.45; }
.chart .seg-none { fill: var(--paper); stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 2; }
.caveat { color: var(--ink-2); font-size: 0.86rem; margin: 0.6rem 0 0; }

/* citations */
.cite { font-size: 0.7em; vertical-align: super; text-decoration: none; margin-left: 0.15em; color: var(--ink-2); }
.cite:hover { color: var(--accent); }
.footnotes { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); font-size: 0.85rem; color: var(--ink-2); }
.footnotes h2 { font-size: 1.2rem; }
.footnotes ol { list-style: none; padding: 0; margin: 0; columns: 3; column-gap: 2rem; }
.footnotes li { font-family: var(--mono); break-inside: avoid; margin: 0 0 0.2rem; white-space: nowrap; }
.fn-n { display: inline-block; min-width: 2.2ch; color: var(--ink); text-align: right; margin-right: 0.3rem; }
.fn-keys { margin: 1rem 0 0; }
.fn-key { display: block; }
.fn-key .mono { color: var(--ink); margin-right: 0.5rem; }
.unwritten { display: inline-block; padding: 0.2rem 0.6rem; border: 1px dashed var(--ink-2); color: var(--ink-2); font-family: var(--mono); font-size: 0.85rem; }
.colophon { margin-top: 3rem; color: var(--ink-2); font-size: 0.85rem; }

@media (max-width: 640px) {
  .chapter-head { grid-template-columns: 1fr; gap: 1rem; }
  .scene { max-width: 200px; }
  body { font-size: 16px; }
  .footnotes ol { columns: 1; }
}

@media (max-width: 640px) {
  .theme { position: static; margin-bottom: 1rem; }
  .kicker { padding-right: 0; }
}

@media print {
  :root { color-scheme: light; --paper: #fff; --ink: #000; --ink-2: #444; --rule: #bbb; --graphite: #777; --graphite-soft: #ddd; --paper-2: #f2f2f2; }
  .theme { display: none; }
  body { font-size: 11pt; }
  .page { max-width: none; padding: 0; }
  .chapter { break-before: page; border-bottom: 0; }
  .chapter#spark { break-before: auto; }
  details { display: block; }
  details > summary { display: none; }
  details:not([open]) > *:not(summary) { display: block; }
  li.beyond { display: list-item; }
  details.more { display: none; }
  a { color: inherit; text-decoration: none; }
  .cite { color: #000; }
  .footnotes { break-before: page; }
  .chart a:hover * { stroke: inherit; }
}
</style>
</head>
<body>
<main class="page">
  <header class="masthead">
    <fieldset class="theme" aria-label="{{theme_label}}" style="margin:0;border-width:1px">
      <input type="radio" name="theme" id="theme-auto" checked><label for="theme-auto">{{theme_auto}}</label>
      <input type="radio" name="theme" id="theme-light"><label for="theme-light">{{theme_light}}</label>
      <input type="radio" name="theme" id="theme-dark"><label for="theme-dark">{{theme_dark}}</label>
    </fieldset>
    <p class="kicker">{{kicker}}</p>
    <p class="ident">{{ident}} <span class="subject">{{subject}}</span> <span class="repo">in {{repo}}</span></p>
    <h1>{{title}}</h1>
    <p class="byline"><span>{{authors_label}} {{authors}}</span><span>{{merged}}</span><span>{{sessions_label}} {{sessions}}</span></p>
  </header>
  {{body}}
  <p class="colophon">{{note}}</p>
</main>
</body>
</html>
